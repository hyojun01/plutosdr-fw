<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTE PlutoSDR Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>RTE PlutoSDR Control</h1>
        <p id="connection">Connecting</p>
      </div>
      <div class="actions">
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <section class="grid">
      <form id="rte-form" class="panel">
        <div class="panel-title">
          <h2>RTE DUT</h2>
          <label class="switch">
            <input id="rte-enabled" type="checkbox">
            <span>Enable</span>
          </label>
        </div>
        <div class="fields">
          <label>
            <span>Delay offset</span>
            <input id="delay-offset" type="number" min="0" max="1023" step="1">
          </label>
          <label>
            <span>FCW</span>
            <input id="fcw" type="number" step="1">
          </label>
          <label>
            <span>Scaling</span>
            <input id="scaling" type="number" min="-1" max="0.99951171875" step="0.00048828125">
          </label>
          <label>
            <span>Phase offset</span>
            <input id="phase-offset" type="number" step="1">
          </label>
        </div>
        <div class="button-row">
          <button type="submit">Apply RTE</button>
          <button id="reset-rte" type="button" class="secondary">Reset</button>
          <button id="load-param" type="button" class="secondary">Load Params</button>
        </div>
        <dl class="status-list">
          <div><dt>Timestamp</dt><dd id="rte-timestamp">-</dd></div>
          <div><dt>Scaling raw</dt><dd id="scaling-raw">-</dd></div>
          <div><dt>Device</dt><dd id="rte-device">-</dd></div>
        </dl>
      </form>

      <form id="ad9361-form" class="panel">
        <div class="panel-title">
          <h2>AD9361</h2>
        </div>
        <div class="fields">
          <label>
            <span>RX LO Hz</span>
            <input id="rx-lo" type="number" min="70000000" step="1">
          </label>
          <label>
            <span>TX LO Hz</span>
            <input id="tx-lo" type="number" min="70000000" step="1">
          </label>
          <label>
            <span>Sample rate Hz</span>
            <input id="sampling-frequency" type="number" min="1" step="1">
          </label>
          <label>
            <span>RX bandwidth Hz</span>
            <input id="rx-rf-bandwidth" type="number" min="1" step="1">
          </label>
          <label>
            <span>TX bandwidth Hz</span>
            <input id="tx-rf-bandwidth" type="number" min="1" step="1">
          </label>
          <label>
            <span>RX gain mode</span>
            <select id="rx-gain-mode">
              <option value="manual">manual</option>
              <option value="slow_attack">slow_attack</option>
              <option value="fast_attack">fast_attack</option>
              <option value="hybrid">hybrid</option>
            </select>
          </label>
          <label>
            <span>RX gain dB</span>
            <input id="rx-gain" type="number" step="0.25">
          </label>
          <label>
            <span>TX gain dB</span>
            <input id="tx-gain" type="number" step="0.25">
          </label>
        </div>
        <div class="button-row">
          <button type="submit">Apply RF</button>
        </div>
        <dl class="status-list">
          <div><dt>IIO device</dt><dd id="ad9361-device">-</dd></div>
        </dl>
      </form>
    </section>

    <section class="log-panel">
      <h2>Status</h2>
      <pre id="log"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
